# The Gatekeeper — the triage half. THE REVIEWER IS A PERSON (#1065).
#
# His ruling, verbatim (2026-09-22, terminal): *"You are the new outside
# reviewer the outfit reviewer is permanently dead and will not come back."*
#
# Until that day this workflow ran `anthropics/claude-code-action` on every
# diff triage said earned a look, and most of this file's history — #165 the
# self-skip, #219 "a red check is not a verdict", #434 the cancelled-run race,
# #566 the absent check, #1026 one verdict per sha, #368 the one-shot label —
# was about telling "the action judged" from "the action died". Read it in
# git if you need it. The action is gone, and with it every one of those
# states. What is left is the half that was always worth keeping:
#
#   TRIAGE DECIDES WHETHER A DIFF EARNS A REVIEW, and says so ON THE PR.
#
#   A review is OWED when any of:
#     - the diff touches money/auth surfaces (`.github/money-surfaces.sh`,
#       both halves — the paths, and a changed line naming the credit API);
#     - the diff changes the rules of the review itself;
#     - the diff touches a surface A CUSTOMER SEES
#       (`.github/customer-surfaces.sh` — `client/src/`, outside the client's
#       own tests and outside the staff panels);
#     - the PR carries the `needs-fable` label (anyone can escalate).
#   Nobody owes a look when none of those is true, or when the PR carries the
#   `skip-review` label.
#
# ⚠ THE SIZE TRIGGER IS GONE, BY HIS WORD AND NOT BY A RAISED NUMBER (#1328,
# 2026-09-26, terminal). Asked *"why must ever PR have a review a fable review
# on PR's seems like a waste of credits doesnt it?"*, told the rule and the
# day's tally — 22 seat PRs reviewed, 0 code defects found, 2 prose claims
# corrected, 22 of 22 instruments red under the relay's hand — then *"i think
# opus 5 is comfrotable on more than 250 lines of code dont you?"* and, on the
# recommendation to remove it outright rather than raise it: **"drop it"**.
# A diff's line count decides nothing here any more, and `>= 50 changed lines
# of non-doc code` is not a rule this repository has.
#
# ⚠ WHAT REPLACED IT IS THE ONE OBLIGATION A GATE CANNOT DISCHARGE. Working
# law 6 says no visual change ships without being looked at in the running app,
# and law 9 puts his eye above any reader's prose. The four mechanical checks
# read every diff; none of them can look at a frame. So a customer-visible diff
# earns `needs-fable` and the comment names the obligation as the relay's eye on
# the rendered frames, both themes. It is a PROXY on a path and it says so.
#
# When a review is owed, triage LABELS the PR `needs-fable` and posts ONE
# comment naming the obligation and the reading (ordinary diffs read
# docs/REVIEWER_CHARTER.md; money/auth diffs read CLAUDE.md in full, #161).
# The relay — Fable, in the founder's terminal — reviews it at its next
# sitting and posts the verdict as a PR comment headed
# `**Fable review — by hand`. That comment IS the verdict:
# `scripts/pr-merge-in-order.mts` reads it off the PR (by the founder's
# account, on the current head — a later push makes it stale), holds a
# money/auth PR until it exists, and merges an ordinary PR on the gate alone
# without it, exactly as the standing orders said during the outages. A shift
# never posts that comment. The four mechanical checks in gate.yml run on
# EVERY PR regardless — nothing merges broken because it was too small.
#
# ONCE PER PR, NOT ONCE PER PUSH (founder ruling 2026-08-26): triage runs when
# the PR is OPENED non-draft or marked READY FOR REVIEW — the shift's own
# "this is finished" signal. A push does not re-run it; the label stays, and
# the verdict's freshness is read against the head at merge time.
#
# ⚠ AND ON `needs-fable` BEING LABELLED (#1194). Those two events cannot fire
# again on a PR that is already open and already ready, so a PR BORN
# CONFLICTING — which gets no `pull_request` run for any event (#566) — lost its
# triage PERMANENTLY. Measured on #1191: opened 23:34:51Z, ready 23:35:10Z, no
# `Fable Review` run created for either, on a 288-line diff. `gate.yml` came
# back on its own when main was merged in, because it also triggers on
# `synchronize`; this did not. (The 288 lines are what earned #1191 a look under
# the rule of the day; that rule is retired — see the `"drop it"` note above.
# The lost-triage half is not: the customer-surface limb is asked twice for
# exactly this reason.)
#
# The standing orders already promised the recovery road — *"the manual road is
# `gh pr edit <n> --add-label needs-fable` and it works ONCE"* — and it had
# stopped working: the label became triage's OUTPUT at #1065 and left the
# trigger list, so the sentence described a closed road. It is true again.
#
# ⚠ It is NOT `synchronize`, which would re-run triage on every push and undo
# the founder's once-per-PR ruling. And the label this workflow applies itself
# cannot re-trigger it: GitHub does not raise workflow events for actions taken
# with the default `GITHUB_TOKEN`, so there is no loop to break.
#
# There is deliberately NO `review` check on a PR any more. A check that
# reported whether a verdict existed was the right instrument for a machine
# whose runs could die; a person's verdict lives where people write, on the
# PR, and the merge tool reads that.

name: Fable Review

on:
  pull_request:
    branches: [main]
    types: [opened, ready_for_review, labeled]

# Two triage runs on one PR supersede each other; two PRs never share a slot.
concurrency:
  group: review-${{ github.event.pull_request.number }}
  cancel-in-progress: true

# Least privilege at the workflow level (zizmor excessive-permissions, #35);
# the job declares what it writes, with reasons.
permissions:
  contents: read

jobs:
  triage:
    name: triage
    # ⚠ A `labeled` event is triage ONLY for the escalation label (#1194). The
    #    gate labels `founder-review` on money diffs and `review-skipped` on
    #    others, and the merge tool never labels; without this guard each of
    #    those would spend a triage run to reach the same verdict.
    if: >-
      ${{ !github.event.pull_request.draft
          && (github.event.action != 'labeled' || github.event.label.name == 'needs-fable') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # the checkout and the diff against main
      pull-requests: write # `gh pr edit --add-label needs-fable` when a review is owed
      issues: write # the one comment naming the obligation (PR comments are issue comments)
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Decide whether this diff earns a review
        id: decide
        env:
          BASE: ${{ github.base_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          if echo ",$LABELS," | grep -q ",skip-review,"; then
            echo "Label skip-review — nobody owes this diff a look."
            echo "review=no" >> "$GITHUB_OUTPUT"; exit 0
          fi

          git fetch origin "$BASE"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD)

          # A change to the review's own rules is always read (#165's
          # obligation, now a person's): the reviewer reads the change to
          # what the reviewer does.
          if echo "$CHANGED" | grep -qxF '.github/workflows/review.yml'; then
            echo "This diff modifies review.yml — the rules of the review itself. A review is owed."
            {
              echo "review=yes"
              echo "deep=no"
              echo "held=yes"
              echo "why=it changes the rules of the review itself (review.yml)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi

          # Money/auth: BOTH halves of the one declaration (#958, #987) — the
          # paths where money is stored and bought, and a changed line under
          # server/ or shared/ naming the credit API, where money is decided.
          . ./.github/money-surfaces.sh
          MONEY_SYMBOL_HITS=$(git diff -G"$MONEY_SYMBOLS" --name-only "origin/$BASE"...HEAD -- server shared || true)
          MONEY=no
          if echo "$CHANGED" | grep -qE "$MONEY_PATHS" || [ -n "$MONEY_SYMBOL_HITS" ]; then
            MONEY=yes
          fi

          # What a CUSTOMER sees (#1328): the one declaration, sourced rather
          # than typed, because `pr-merge-in-order.mts` asks the same question —
          # the shape `money-surfaces.sh` was carved out for after #958's two
          # copies drifted.
          . ./.github/customer-surfaces.sh
          CUSTOMER=$(echo "$CHANGED" | grep -E "$CUSTOMER_SURFACE_PATHS" | grep -vE "$CUSTOMER_SURFACE_EXEMPT" || true)

          if [ "$MONEY" = "yes" ]; then
            echo "Money/auth surfaces touched — a review is owed, and it reads CLAUDE.md in full."
            {
              echo "review=yes"
              echo "deep=yes"
              echo "why=it touches a money/auth surface"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deep=no" >> "$GITHUB_OUTPUT"
          if echo ",$LABELS," | grep -q ",needs-fable,"; then
            echo "Label needs-fable — escalated; a review is owed (charter reading)."
            {
              echo "review=yes"
              echo "why=it was escalated with the needs-fable label"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ -n "$CUSTOMER" ]; then
            # ⚠ ONE LINE into `$GITHUB_OUTPUT`: the file list can be long and a
            #   multi-line value would be read as several outputs.
            COUNT=$(echo "$CUSTOMER" | wc -l | tr -d ' ')
            FIRST=$(echo "$CUSTOMER" | head -1)
            echo "Customer-visible files changed ($COUNT):"
            echo "$CUSTOMER"
            {
              echo "review=yes"
              echo "frames=yes"
              echo "why=it changes what a customer sees ($COUNT file(s) under client/src/, e.g. $FIRST)"
            } >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "No money/auth surface, no customer surface, no escalation — nobody owes this diff a look; the four mechanical checks still apply."
          echo "review=no" >> "$GITHUB_OUTPUT"

      # The obligation lives ON THE PR: a label the merge tool reads, and one
      # comment a person reads. The label is applied even when it is already
      # there (idempotent); the comment is posted once, by its marker, so a
      # second triage run on the same PR does not repeat it.
      - name: Say on the PR that a review is owed, and to whom
        if: ${{ steps.decide.outputs.review == 'yes' }}
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          DEEP: ${{ steps.decide.outputs.deep }}
          HELD: ${{ steps.decide.outputs.held }}
          FRAMES: ${{ steps.decide.outputs.frames }}
          WHY: ${{ steps.decide.outputs.why }}
        run: |
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label needs-fable
          MARKER='<!-- hand-review-owed -->'
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json comments --jq '.comments[].body' | grep -qF "$MARKER"; then
            echo "Already said on the PR; comment not repeated."
            exit 0
          fi
          # HELD or not is the merge tool's rule, said here in the same words:
          # money/auth and a change to review.yml wait for the verdict; an
          # ordinary diff may merge on the gate alone (the standing orders).
          if [ "$DEEP" = "yes" ]; then
            READING='This is a **money/auth** diff: the review reads CLAUDE.md in full, and this PR is HELD until the verdict is posted — a shift neither merges it nor posts one.'
          elif [ "$HELD" = "yes" ]; then
            READING='This diff changes the rules of the review itself: the review reads docs/REVIEWER_CHARTER.md, and this PR is HELD until the verdict is posted — a shift neither merges it nor posts one.'
          elif [ "$FRAMES" = "yes" ]; then
            # ⚠ Double quotes because the sentence carries an apostrophe; there
            #   is deliberately no backtick or $ in it, which inside double
            #   quotes would be command or variable substitution.
            READING="This diff touches a surface a customer SEES, so the obligation is the relay's EYE ON THE RENDERED FRAMES, BOTH THEMES — working law 6, and the one thing none of the four mechanical checks can do — beside the reading of docs/REVIEWER_CHARTER.md. The path is a PROXY for what a customer notices, and it is the only signal a workflow has: a client diff that moves no pixel earns a look it did not need. The standing orders let a shift merge it on the gate alone if the verdict has not landed yet."
          else
            READING='An ordinary diff: the review reads docs/REVIEWER_CHARTER.md. The standing orders let a shift merge it on the gate alone if the verdict has not landed yet.'
          fi
          # Built line by line rather than as a heredoc: a heredoc's body must
          # start at column 0, which is a YAML syntax error inside this block.
          BODY="$MARKER"
          BODY="$BODY"$'\n'"**A review is owed on this PR** — $WHY."
          BODY="$BODY"$'\n\n'"The reviewer is the relay (Fable, in the founder's terminal), at its next sitting. $READING"
          BODY="$BODY"$'\n\n'"The verdict arrives as a comment headed \`**Fable review — by hand\` and \`pr-merge-in-order\` reads it off this PR — by the founder's account, on the current head; a later push makes it stale. It reviews, in priority order: correctness bugs (concrete inputs that produce wrong output, a crash, or lost money); enforcement-invariant violations (CLAUDE.md); flag discipline (new reachable behaviour landing dark); controls a deletion or refactor could orphan — name what was bolted to the deleted path; and tests (a fix without its failing reproduction, a class fix without its sweep). A pass says what was checked; it does not invent findings."
          gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "$BODY"
