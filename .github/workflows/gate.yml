# The Gatekeeper — mechanical half.
#
# Runs the repo's own four instruments on every PR into main, and labels
# any diff touching money or auth surfaces with `founder-review` so it is
# visible in the digest and always gets the full Fable review — but it does
# NOT block merge on founder approval. Founder ruling 2026-08-25: "dont
# worry about money paths just run it - ill let you know if there are money
# issues."
#
# Direct pushes to main by the deploy rite are untouched: branch protection
# is configured with enforce_admins off, so the rite's push path (admin,
# via the pre-push hook ceremony) bypasses these checks. Agent-built work
# arrives as PRs and cannot.

# MANUAL RE-RUN (issue #80). GitHub creates no `pull_request` run at all —
# no banner, no failure — when a PR's merge ref cannot be built (a
# CONFLICTING PR), and on 2026-08-26 a shift sat forty minutes waiting for
# a green that could not arrive. Check `gh pr view <n> --json mergeable`
# first; when the PR is clean and the run is simply missing, dispatch it by
# hand against the PR's OWN head branch:
#
#   gh workflow run gate.yml --ref <head-branch> -f pr_number=<n>
#
# A dispatched run attaches its check runs to the commit at that ref, which
# is the PR head, so the two required checks (gate-checks, founder-gate)
# satisfy branch protection. And it TESTS the same bytes an event-driven
# run tests: both jobs check out `refs/pull/<n>/merge` (the head merged
# into current main) on the dispatch path, exactly as a `pull_request`
# event does by default — a dispatch that checked out the head alone would
# pass a PR that main has since broken (review finding on PR #87). The
# `resolve` job refuses a dispatch whose ref is not that PR's head — a run
# that gated the wrong commit would report green on bytes nobody proposed —
# and refuses a PR that is not MERGEABLE, which has no merge ref to test.
# And when it refuses, the two required jobs FAIL rather than skip: GitHub
# treats a skipped required check as passing, so a plain `needs:` would
# have painted a wrong dispatch green on that branch's head (measured on
# this workflow's own negative control, 2026-08-26, before it merged).
#
# review.yml deliberately has NO dispatch road: claude-code-action's
# `track_progress` (the sticky review comment) is pull_request/issue-only
# per its own input doc, so a dispatched review would post nowhere. Its
# manual road is the `labeled` event it already listens to —
# `gh pr edit <n> --add-label needs-fable` re-runs it with full PR context.

name: Gate

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to gate — run this against the PR's head branch (--ref)"
        required: true
        type: string

concurrency:
  group: gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

jobs:
  # One place that answers "which PR, and which base" for both event shapes.
  # On pull_request it just echoes the event; on workflow_dispatch it asks
  # GitHub and refuses unless the dispatched ref IS that PR's head commit.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 3
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.pr.outputs.base }}
      # Empty on the event path (checkout's default is the merge ref there);
      # the merge ref by name on the dispatch path.
      ref: ${{ steps.pr.outputs.ref }}
    steps:
      - name: Resolve the PR this run gates
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.base_ref }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "pr=$EVENT_PR" >> "$GITHUB_OUTPUT"
            echo "base=$EVENT_BASE" >> "$GITHUB_OUTPUT"
            echo "pull_request event: PR #$EVENT_PR into $EVENT_BASE"
            exit 0
          fi

          # workflow_dispatch: the PR is an input and must be proven.
          case "$INPUT_PR" in
            ''|*[!0-9]*) echo "::error::pr_number must be a PR number, got '$INPUT_PR'"; exit 1 ;;
          esac
          JSON=$(gh pr view "$INPUT_PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,headRefOid,mergeable)
          STATE=$(echo "$JSON" | jq -r .state)
          MERGEABLE=$(echo "$JSON" | jq -r .mergeable)
          BASE=$(echo "$JSON" | jq -r .baseRefName)
          HEAD_REF=$(echo "$JSON" | jq -r .headRefName)
          HEAD_SHA=$(echo "$JSON" | jq -r .headRefOid)

          if [ "$STATE" != "OPEN" ]; then
            echo "::error::PR #$INPUT_PR is $STATE, not OPEN"; exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatched ref ($GITHUB_REF_NAME @ $GITHUB_SHA) is not PR #$INPUT_PR's head ($HEAD_REF @ $HEAD_SHA). Re-run with --ref $HEAD_REF."
            exit 1
          fi
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "::error::PR #$INPUT_PR is $MERGEABLE, so there is no merge ref to test. Merge $BASE into $HEAD_REF (regenerate the atlas if it conflicts), push, then dispatch again."
            exit 1
          fi

          echo "pr=$INPUT_PR" >> "$GITHUB_OUTPUT"
          echo "base=$BASE" >> "$GITHUB_OUTPUT"
          echo "ref=refs/pull/$INPUT_PR/merge" >> "$GITHUB_OUTPUT"
          echo "workflow_dispatch: PR #$INPUT_PR ($HEAD_REF @ $HEAD_SHA) into $BASE"

  gate-checks:
    name: gate-checks
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        run: |
          echo "::error::resolve did not succeed (${{ needs.resolve.result }}) — this run gates nothing."
          exit 1

      - uses: actions/checkout@v7
        with:
          # Event path: empty → checkout's default, the merge ref.
          # Dispatch path: the same merge ref, named — see the header.
          ref: ${{ needs.resolve.outputs.ref }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck (pnpm check)
        run: pnpm check

      - name: Architecture Atlas freshness
        run: pnpm architecture:check

      # Blocking again as of issue #37's fix: the walk in
      # scripts/lib/capabilityAtlas.mts sorts on the separator-neutral path, so
      # one commit yields one verdict on Windows and Linux alike (the Windows
      # arm is the walk-order test in server/capabilityAtlas.test.ts; this
      # step is the Linux arm).
      - name: Capability Atlas (static)
        run: pnpm capability:check

      - name: Unit tests
        run: pnpm test

  founder-gate:
    name: founder-gate
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        run: |
          echo "::error::resolve did not succeed (${{ needs.resolve.result }}) — this run gates nothing."
          exit 1

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.ref }}

      - name: Money/auth surface check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          # Surfaces where a bot's approval is never enough (CLAUDE.md:
          # billing, credits, auth, and session code are production-critical).
          PATTERNS='^server/routes/(billing|credits|auth|emailAuth|googleAuth|emailVerification)|^server/db/(billing|credits)\.ts$|^server/stripe/|^server/_core/(sdk|cookies|trpc|env)\.ts$|^server/security/|^shared/const\.ts$|^drizzle/'

          # Full fetch, deliberately: a --depth=1 fetch of the base cannot
          # reach the merge base once main outpaces the branch point, and
          # `...HEAD` then dies with "no merge base" — which failed PR #84
          # twice (2026-08-26). The checkout above is already fetch-depth: 0,
          # so this costs nothing.
          git fetch origin "$BASE"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD)
          HITS=$(echo "$CHANGED" | grep -E "$PATTERNS" || true)

          if [ -z "$HITS" ]; then
            echo "No money/auth surfaces touched."
            exit 0
          fi

          # Label only — visibility, not a block (founder ruling 2026-08-25).
          # The label also forces the full Fable review in review.yml.
          echo "Money/auth surfaces touched (labelled, not blocked):"
          echo "$HITS"
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label founder-review || true
          echo "::notice::This PR touches billing/credits/auth/session surfaces — labelled founder-review for the digest and full Fable review."
          exit 0
