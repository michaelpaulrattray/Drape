# The Gatekeeper — mechanical half.
#
# Runs the repo's own four instruments on every PR into main, and labels
# any diff touching money or auth surfaces with `founder-review` so it is
# visible in the digest and always gets the full Fable review — but it does
# NOT block merge on founder approval. Founder ruling 2026-08-25: "dont
# worry about money paths just run it - ill let you know if there are money
# issues."
#
# Direct pushes by the deploy rite are untouched: the rite pushes `main` (the
# one production-deploying branch since the 2026-09-06 flip, #508 — the
# equally protected `local-migration`, #461, is deleted), and it is configured
# with enforce_admins off, so the rite's push path (admin, via the pre-push
# hook ceremony) bypasses these checks. Agent-built work arrives as PRs and
# cannot.

# MANUAL RE-RUN (issue #80). GitHub creates no `pull_request` run at all —
# no banner, no failure — when a PR's merge ref cannot be built (a
# CONFLICTING PR), and on 2026-08-26 a shift sat forty minutes waiting for
# a green that could not arrive. Check `gh pr view <n> --json mergeable`
# first; when the PR is clean and the run is simply missing, dispatch it by
# hand against the PR's OWN head branch:
#
#   gh workflow run gate.yml --ref <head-branch> -f pr_number=<n>
#
# A dispatched run attaches its check runs to the commit at that ref, which
# is the PR head, so the four required checks (gate-checks, founder-gate,
# static-shapes, bundle-budget) satisfy branch protection. And it TESTS the
# same bytes an event-driven run tests: all four jobs check out `refs/pull/<n>/merge`
# (the head merged into current main) on the dispatch path, exactly as a
# `pull_request` event does by default — a dispatch that checked out the head alone would
# pass a PR that main has since broken (review finding on PR #87). The
# `resolve` job refuses a dispatch whose ref is not that PR's head — a run
# that gated the wrong commit would report green on bytes nobody proposed —
# and refuses a PR that is not MERGEABLE, which has no merge ref to test.
# And when it refuses, the required jobs FAIL rather than skip: GitHub
# treats a skipped required check as passing, so a plain `needs:` would
# have painted a wrong dispatch green on that branch's head (measured on
# this workflow's own negative control, 2026-08-26, before it merged).
#
# review.yml has no machine reviewer any more (#1065, his ruling 2026-09-22:
# the action reviewer is permanently dead; the relay IS the reviewer). Its
# triage still decides which diffs earn a look and says so on the PR with the
# `needs-fable` label and one comment; the verdict is a PR comment by the
# founder's account headed `**Fable review — by hand`, which
# scripts/pr-merge-in-order.mts reads. To ask for a look on a diff triage did
# not label, apply `needs-fable` by hand — the label is the queue, not a
# button, and it starts nothing by itself.

name: Gate

# ⚠ NO `ready_for_review` HERE, AND ITS ABSENCE IS THE FIX FOR #503. The gate
# runs on DRAFT pull requests — no job filters on `github.event.pull_request.draft`
# — so by the time a shift runs `gh pr ready` the head commit has already been
# gated and its required checks are attached to it. The extra run tested
# identical bytes and, through `gate-<pr>` below, CANCELLED the draft's still
# running one.
#
# Measured over the last 100 gate runs (2026-09-02 → 2026-09-04): 19 cancelled,
# and ELEVEN of them were this — a later run on the same branch with the SAME
# head sha. Confirmed at three PR timelines, each `ready_for_review` landing
# within two seconds of its duplicate run's creation: PR #496 (04:04:23 →
# 04:04:25), PR #488 (23:27:51 → 23:27:53), PR #451 (11:29:42 → 11:29:44). The
# team's own documented habit — open as a draft, iterate, `gh pr ready` once —
# was what fired it, so it hit almost every PR.
#
# The other eight cancellations WERE second pushes, and those are left alone
# deliberately: the shift already holds the fix, so the in-flight run is testing
# superseded bytes and `cancel-in-progress` is doing its job. #503 proposed
# blocking that push; the measurement argues the other way and the card carries
# the reasoning.
#
# ⚠ `review.yml` KEEPS ITS `ready_for_review` — that is precisely how the Fable
# review fires once, on purpose, and it is a different question from this one.
# server/gateTriggers.test.ts holds both halves apart.
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to gate — run this against the PR's head branch (--ref)"
        required: true
        type: string

concurrency:
  group: gate-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

# Least privilege at the workflow level (zizmor excessive-permissions, #35):
# a job that needs more declares it beside a reason.
permissions:
  contents: read

jobs:
  # One place that answers "which PR, and which base" for both event shapes.
  # On pull_request it just echoes the event; on workflow_dispatch it asks
  # GitHub and refuses unless the dispatched ref IS that PR's head commit.
  resolve:
    name: resolve
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: read # `gh pr view` on the dispatch path reads the PR's state, head and mergeability
    outputs:
      pr: ${{ steps.pr.outputs.pr }}
      base: ${{ steps.pr.outputs.base }}
      # Empty on the event path (checkout's default is the merge ref there);
      # the merge ref by name on the dispatch path.
      ref: ${{ steps.pr.outputs.ref }}
    steps:
      - name: Resolve the PR this run gates
        id: pr
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT_PR: ${{ github.event.pull_request.number }}
          EVENT_BASE: ${{ github.base_ref }}
          INPUT_PR: ${{ inputs.pr_number }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            echo "pr=$EVENT_PR" >> "$GITHUB_OUTPUT"
            echo "base=$EVENT_BASE" >> "$GITHUB_OUTPUT"
            echo "pull_request event: PR #$EVENT_PR into $EVENT_BASE"
            exit 0
          fi

          # workflow_dispatch: the PR is an input and must be proven.
          case "$INPUT_PR" in
            ''|*[!0-9]*) echo "::error::pr_number must be a PR number, got '$INPUT_PR'"; exit 1 ;;
          esac
          JSON=$(gh pr view "$INPUT_PR" --repo "$GITHUB_REPOSITORY" --json state,baseRefName,headRefName,headRefOid,mergeable)
          STATE=$(echo "$JSON" | jq -r .state)
          MERGEABLE=$(echo "$JSON" | jq -r .mergeable)
          BASE=$(echo "$JSON" | jq -r .baseRefName)
          HEAD_REF=$(echo "$JSON" | jq -r .headRefName)
          HEAD_SHA=$(echo "$JSON" | jq -r .headRefOid)

          if [ "$STATE" != "OPEN" ]; then
            echo "::error::PR #$INPUT_PR is $STATE, not OPEN"; exit 1
          fi
          if [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::error::Dispatched ref ($GITHUB_REF_NAME @ $GITHUB_SHA) is not PR #$INPUT_PR's head ($HEAD_REF @ $HEAD_SHA). Re-run with --ref $HEAD_REF."
            exit 1
          fi
          if [ "$MERGEABLE" != "MERGEABLE" ]; then
            echo "::error::PR #$INPUT_PR is $MERGEABLE, so there is no merge ref to test. Merge $BASE into $HEAD_REF (regenerate the atlas if it conflicts), push, then dispatch again."
            exit 1
          fi

          {
            echo "pr=$INPUT_PR"
            echo "base=$BASE"
            echo "ref=refs/pull/$INPUT_PR/merge"
          } >> "$GITHUB_OUTPUT"
          echo "workflow_dispatch: PR #$INPUT_PR ($HEAD_REF @ $HEAD_SHA) into $BASE"

  gate-checks:
    name: gate-checks
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        env:
          RESULT: ${{ needs.resolve.result }}
        run: |
          echo "::error::resolve did not succeed ($RESULT) — this run gates nothing."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Event path: empty → checkout's default, the merge ref.
          # Dispatch path: the same merge ref, named — see the header.
          ref: ${{ needs.resolve.outputs.ref }}
          # Full history: the secret scan below walks the PR's own commits
          # (base..HEAD), which a depth-1 clone cannot reach (the #84 stall).
          fetch-depth: 0
          # The repo is public, so the fetches below need no token; nothing
          # here pushes. Leaving the token in .git/config is what zizmor's
          # artipacked audit is about.
          persist-credentials: false

      # The Warden's secret scan (issue #32) — first, before any install, so
      # a leaked key fails in seconds. It scans the PR's OWN commits, so a
      # secret that was committed and then "removed" in a later commit still
      # reddens the gate: the bytes are in the branch history either way,
      # and only a rewrite takes them out. Binary pinned by sha256 inside the
      # script; the same script runs by hand (scripts/secret-scan.sh) and
      # weekly over the full history (secrets.yml). Values are never
      # printed (--redact).
      - name: Secret scan (gitleaks, this PR's commits)
        env:
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          # Version + sha256 are pinned INSIDE the script, once, for both runs.
          GITLEAKS="$(sh scripts/secret-scan.sh fetch)"
          git fetch origin "$BASE"
          GITLEAKS="$GITLEAKS" sh scripts/secret-scan.sh "origin/$BASE"

      # The Warden's workflow lint (issue #35): actionlint for shape, zizmor
      # (pedantic) for safety — unpinned actions, template injection, broad
      # permissions, persisted credentials. Runs on every PR, before install,
      # because it takes seconds and the workflows are what everything else
      # here trusts. Binaries pinned by sha256 inside the script; the same
      # script runs by hand (scripts/workflow-lint.sh).
      - name: Workflow lint (actionlint + zizmor)
        run: |
          sh scripts/workflow-lint.sh fetch
          ACTIONLINT=/tmp/actionlint ZIZMOR=/tmp/zizmor sh scripts/workflow-lint.sh

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      # The Warden's semgrep step used to run HERE, in front of the install
      # (#33). It is the `static-shapes` job below since #1034: it needs no
      # node_modules, so it was ~100 s of a ~500 s serial job spent on a
      # reading that could run beside the rest.
      - name: Install
        run: pnpm install --frozen-lockfile

      # ⚠ A PULL REQUEST MUST NOT CLOSE A CARD BY ACCIDENT (#376, eight
      # instances in five grammatical frames). GitHub reads `Closes #N` in a PR
      # body or title and nothing after it — including a sentence written to say
      # the keyword is being withheld, which is instance 3 and instance 7. Two
      # of the eight closed cards whose bar was "his eye closes it".
      #
      # It runs BEFORE the expensive checks: the repair is one edit to the PR
      # description, and finding that out at 30 seconds rather than 8 minutes is
      # the whole point. Cards are closed by `gh issue close` with a receipt
      # after the deploy, which is what every card here already gets.
      #
      # Skipped only when there is no PR to read (a manual `workflow_dispatch`
      # without `pr_number`), never when the read FAILS — the script refuses on
      # an unreadable PR rather than passing over a question nobody answered.
      - name: PR body closes no card by accident (#376)
        if: ${{ needs.resolve.outputs.pr != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          # Named rather than inferred from the checkout's remote, for the
          # money/auth step's reason: this run may gate a ref, not a clone.
          GH_REPO: ${{ github.repository }}
          PR: ${{ needs.resolve.outputs.pr }}
        run: npx tsx scripts/check-closing-keyword.mts --pr "$PR"

      - name: Typecheck (pnpm check)
        run: pnpm check

      - name: Architecture Atlas freshness
        run: pnpm architecture:check

      # Blocking again as of issue #37's fix: the walk in
      # scripts/lib/capabilityAtlas.mts sorts on the separator-neutral path, so
      # one commit yields one verdict on Windows and Linux alike (the Windows
      # arm is the walk-order test in server/capabilityAtlas.test.ts; this
      # step is the Linux arm).
      - name: Capability Atlas (static)
        run: pnpm capability:check

      - name: Unit tests
        run: pnpm test

      # The design laws' own controls (#512): each law against a synthetic page
      # built to break it, and a compliant page it must not redden. It proves
      # the INSTRUMENT, which is working law 2 — a green design-law run over
      # nineteen surfaces means nothing if the laws cannot fail, and this suite
      # has been caught passing vacuously twice.
      #
      # It runs here because it needs none of what the walk over the real app
      # needs — no server, no session, no database, no credits — only a
      # browser, and the runner image ships Chrome. Measured at 15s on the
      # founder's machine, so it is not path-filtered: a filter is a second
      # list that drifts (#501), and 15s does not buy one.
      #
      # It REFUSES rather than skipping when no browser is found. A control
      # that quietly does not run does not exist (invariant 7), and a green
      # check would be the exact failure this whole card is about.
      - name: Design-law controls (each law must still be able to fail)
        run: npx tsx scripts/drive-design-laws.mts --controls

      # The interaction-latency instrument's own controls (#555): a synthetic
      # page with an instant action, a two-second one, one that changes nothing
      # and one that is not there — plus a clock ticking beside them that must
      # NOT count as the change. Same reasoning as the step above: it proves
      # the INSTRUMENT, needs only a browser, and was driven under sabotage
      # (the clock read as a 13 ms change) before it was trusted. ~7 s.
      - name: Interaction-latency controls (the reader must still tell fast from slow from never)
        run: npx tsx scripts/drive-interaction-latency.mts --controls

  founder-gate:
    name: founder-gate
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: write # `gh pr edit --add-label founder-review` on money/auth diffs
      issues: write # `gh pr comment` posts an issue comment on GitHub's API (reviewer-change visibility, #165)
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        env:
          RESULT: ${{ needs.resolve.result }}
        run: |
          echo "::error::resolve did not succeed ($RESULT) — this run gates nothing."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
          ref: ${{ needs.resolve.outputs.ref }}
          # Public repo, read-only git below; the label write goes through gh.
          persist-credentials: false

      - name: Money/auth surface check
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          # TWO readings, because a path list answers only half the question
          # (#958). The first is WHERE MONEY IS STORED AND BOUGHT; the second is
          # WHERE MONEY IS DECIDED, and until 2026-09-15 nothing asked it — over
          # the 60 newest merged PRs the path list labelled 4, none of them a
          # credit-refund fix.
          #
          # ⚠ THE DECLARATION IS NOT HERE. It lives in `.github/money-surfaces.sh`
          # and `review.yml` sources the same bytes, because the two workflows
          # carried identical copies and drifted. That file holds the whole
          # measurement, what each reading covers, and what the symbol reading
          # deliberately does not claim. Both are extracted and driven by
          # `server/moneySurfaceClassifier.test.ts`: a pattern edited without
          # that suite going green is an unmeasured change to which money PRs
          # reach the founder's eye.
          . ./.github/money-surfaces.sh

          # Full fetch, deliberately: a --depth=1 fetch of the base cannot
          # reach the merge base once main outpaces the branch point, and
          # `...HEAD` then dies with "no merge base" — which failed PR #84
          # twice (2026-08-26). The checkout above is already fetch-depth: 0,
          # so this costs nothing.
          git fetch origin "$BASE"
          CHANGED=$(git diff --name-only "origin/$BASE"...HEAD)
          PATH_HITS=$(echo "$CHANGED" | grep -E "$MONEY_PATHS" || true)

          # Test files are deliberately IN SCOPE here. Measured: PR #874 — a
          # real refund fix — changed no production line mentioning these
          # symbols, and its only symbol-bearing file was the suite. Excluding
          # tests would have dropped it, which is the silent direction.
          SYMBOL_HITS=$(git diff -G"$MONEY_SYMBOLS" --name-only "origin/$BASE"...HEAD -- server shared || true)

          if [ -z "$PATH_HITS" ] && [ -z "$SYMBOL_HITS" ]; then
            echo "No money/auth surfaces touched."
            exit 0
          fi

          # Label only — visibility, not a block (founder ruling 2026-08-25).
          # The label also forces the full Fable review in review.yml.
          echo "Money/auth surfaces touched (labelled, not blocked):"
          # Printed unindented on purpose: `sed 's/^/    /'` is SC2001, and the
          # parameter-expansion form shellcheck suggests does not indent every
          # line of a multi-line list. The two headers are what separate them.
          if [ -n "$PATH_HITS" ]; then
            echo "-- by path (money stored and bought):"
            echo "$PATH_HITS"
          fi
          if [ -n "$SYMBOL_HITS" ]; then
            echo "-- by credit-API symbol (money decided):"
            echo "$SYMBOL_HITS"
          fi
          gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label founder-review || true
          echo "::notice::This PR touches billing/credits/auth/session surfaces, or changes a line that moves credits — labelled founder-review for the digest and full Fable review."
          exit 0

      # The reviewer cannot review its own change (issue #165):
      # claude-code-action self-skips on any PR whose diff modifies
      # review.yml, and that skip used to read as a green `review` check.
      # review.yml's own triage now reddens that check; THIS step is the
      # always-runs half — every pull_request event including synchronize,
      # and even under a skip-review label — so the fact is visible on the
      # PR itself: a `review-skipped` label plus one comment naming the
      # hand-review obligation. Label first, comment only when the label was
      # absent, so pushes to the branch do not repeat the comment.
      - name: Reviewer-change visibility (review.yml in diff)
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ needs.resolve.outputs.pr }}
          BASE: ${{ needs.resolve.outputs.base }}
        run: |
          # Base already fetched in full by the step above; refresh is cheap
          # and keeps this step self-contained.
          git fetch origin "$BASE"
          if git diff --quiet "origin/$BASE"...HEAD -- .github/workflows/review.yml; then
            echo "review.yml untouched — triage decides whether a hand review is owed (#1065)."
            # The label is DERIVED from the diff, never left to drift (law 4):
            # a push that reverts the review.yml edit takes the label with it.
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --remove-label review-skipped 2>/dev/null || true
            exit 0
          fi

          echo "This PR modifies review.yml — the rules of the review itself; the relay reads it by hand (#1065)."
          if gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name' | grep -qxF review-skipped; then
            echo "Already labelled review-skipped; comment not repeated."
          else
            gh pr edit "$PR" --repo "$GITHUB_REPOSITORY" --add-label review-skipped || true
            gh pr comment "$PR" --repo "$GITHUB_REPOSITORY" --body "**The Fable review DID NOT RUN on this PR.** The diff modifies \`.github/workflows/review.yml\`, and claude-code-action refuses to run when the workflow file invoking it differs from the default branch (its own anti-exfiltration control) — so its skip cannot produce a real review. The \`review\` check on this PR is forced red for the same reason. **Review the reviewer change by hand before merging** (issue #165)." || true
          fi
          echo "::notice::review.yml modified — labelled review-skipped so the relay reads the change to its own rules (issue #165, #1065)."
          exit 0

  # The Warden's static shape reader (issue #33): the OSS Semgrep rulesets
  # over everything git tracks minus .semgrepignore, failing on any finding
  # (`--error`). Same bytes as by hand — `pnpm warden:semgrep` holds the
  # rulesets and flags in ONE place (package.json), so this step names only
  # the tool version. semgrep is a Python tool, not an npm dependency, hence
  # pipx (preinstalled on ubuntu-latest) and a version pin rather than a
  # lockfile; the record page (docs/WARDEN_SEMGREP.md) states the same
  # version, and a reading whose rule count moves from the recorded one is
  # the registry's change, not the tree's. A finding is suppressed AT ITS
  # LINE with `// nosemgrep: <rule.id> -- <reason>`, never globally.
  #
  # ITS OWN JOB SINCE #1034 (Machinist run 4). It reads the tree and needs no
  # `pnpm install`, and it was ~100 s (66–103 s over the four newest green
  # runs) of a `gate-checks` job that ran everything one after another —
  # about a fifth of a ~500 s run, spent in front of the tests on a reading
  # that has nothing to wait for. Beside `gate-checks` it costs the run's
  # wall-clock nothing: measured before the split, median 521 s over the
  # twelve newest green pull_request runs (the AFTER reading is on #1034).
  #
  # ⚠ A JOB OF ITS OWN IS A DECORATION UNLESS SOMETHING READS IT. The account
  # that merges here is an admin and `enforce_admins` is off (#460), so a
  # required status check alone does not bind the merge road —
  # `scripts/pr-merge-in-order.mts` reads THIS job by name on the PR's head,
  # exactly as it reads `gate-checks`, and stops on a red one. The name is
  # asserted against this file's job names there and in
  # `server/prMergeOrder.test.ts`; renaming it here without that reader is
  # how a semgrep finding stops blocking anything while the check still
  # goes red on the PR page. It is ALSO registered as a required check on
  # `main`, which binds anyone who is not an admin.
  static-shapes:
    name: static-shapes
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        env:
          RESULT: ${{ needs.resolve.result }}
        run: |
          echo "::error::resolve did not succeed ($RESULT) — this run gates nothing."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The same merge ref `gate-checks` tests — see the header.
          ref: ${{ needs.resolve.outputs.ref }}
          # semgrep reads the tree as it stands; no history is walked here.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      # Node is set up BEFORE semgrep, which runs `pnpm` and would otherwise
      # execute on whatever Node the runner image ships that week — a
      # required check going red for a reason unrelated to the tree (review
      # of PR #109, finding 2). setup-node needs no node_modules, so the job
      # keeps its no-install property.
      #
      # ⚠ NO `cache: pnpm` HERE, ON PURPOSE (#1059). This job never runs
      # `pnpm install`, so the pnpm store it would cache never exists. On a PR
      # whose lockfile is unchanged the cache key hits and nothing is saved;
      # on any PR that CHANGES `pnpm-lock.yaml` the key misses, setup-node's
      # post step tries to save a directory that was never created, and the
      # job goes red AFTER semgrep passed — measured on four Dependabot PRs
      # in one morning (#1054–#1057), with #1053 (lockfile untouched) green
      # on the same job the same hour as the control. A cache declared on a
      # job that never populates it is a red check waiting for a lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24

      - name: Static shapes (semgrep, OSS rulesets)
        run: |
          pipx install semgrep==1.174.0
          semgrep --version
          pnpm warden:semgrep

  # THE BUNDLE BUDGET (#1035, Machinist run 4) — does the first download still
  # fit? The client is built here, the same `vite build` the deploy rite runs,
  # and `scripts/bundle-budget.mts` refuses when the JS a customer fetches
  # before first paint (every module script and modulepreload the built
  # index.html names — one file today, `assets/index-<hash>.js`) exceeds the
  # budget declared ONCE in `scripts/lib/bundleBudget.mts`: 480 kB on 452.4 kB
  # measured, ~6% headroom. Level-9 gzip, the ledger's own reader
  # (`bundleFold.mts`), so this number and `pnpm machinist:bundle`'s are one
  # number; Vite's build report gzips at its default level and says 12 kB more
  # for the same file. The gate did not build the client at all before this
  # job: 636.9 kB → 451.8 kB was #832's split, and nothing would have said so
  # if it grew back.
  #
  # ITS OWN JOB, not a step in `gate-checks`: a build needs `node_modules`, so
  # it cannot share `static-shapes`' no-install shape, and inside `gate-checks`
  # it would add ~30 s to the serial run #1034 just cut. Beside it the cost is
  # a second runner's install (~40 s) plus the build, all under `gate-checks`'
  # own ~400 s, so the wall-clock does not move. Built with no `.env`, so the
  # runner reads 452.3 kB where a local build reads 452.4 kB (the `VITE_*`
  # literals) — a tenth of a kilobyte, not a regression.
  #
  # ⚠ READ BY THE MERGE TOOL BY NAME, for `static-shapes`' reason above:
  # `scripts/pr-merge-in-order.mts` stops on a red `bundle-budget`, refuses a
  # gated head that lacks the job, and asserts this name against the file's
  # declared jobs at startup. It is also registered as a required check on
  # `main`. `pnpm preflight` runs the same script before the first push, so a
  # customer surface pulling a staff page eager is red on the shift's own box
  # at ten seconds. Driven before it merged: an eager `AdminOverview` import
  # read 555.9 kB and exit 1; the tree as it stands read 452.4 kB and exit 0.
  bundle-budget:
    name: bundle-budget
    needs: resolve
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # A failed resolve must redden this required check, never skip it.
      - name: Refuse unless resolve succeeded
        if: ${{ needs.resolve.result != 'success' }}
        env:
          RESULT: ${{ needs.resolve.result }}
        run: |
          echo "::error::resolve did not succeed ($RESULT) — this run gates nothing."
          exit 1

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # The same merge ref `gate-checks` tests — see the header.
          ref: ${{ needs.resolve.outputs.ref }}
          # The build reads the tree as it stands; no history is walked here.
          persist-credentials: false

      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Bundle budget (build the client, judge the first download)
        run: npx tsx scripts/bundle-budget.mts
