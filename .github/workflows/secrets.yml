# The Warden's weekly full-history secret scan (issue #32).
#
# The gate scans each PR's own commits as it arrives; this walks EVERY
# commit on main once a week, so a secret that reached main by a road the
# gate does not see (the deploy rite's direct pushes, a rewrite, a merge
# from before the gate existed) is found within seven days rather than
# never. Same binary, same config, same script as the gate — one
# instrument, two ranges — so the two readings cannot disagree.
#
# A red run here is a Warden finding: read the redacted output in the
# Actions log (the value is never printed), rotate the credential FIRST,
# then decide the history. Filing rule: a hit is an issue the same day.
#
# First full reading, 2026-08-26: 2668 commits, 0 findings under
# .gitleaks.toml (34 raw hits, all UUID publicIds and file slugs in
# disposable court scripts, classified at the bytes before the allowlist
# was written; a planted AWS key, Stripe key and Google key each redden
# the same command).
#
# By hand:  gh workflow run secrets.yml
# Locally:  GITLEAKS=/path/to/gitleaks scripts/secret-scan.sh

name: Secrets (full history)

on:
  schedule:
    # Mondays 16:00 UTC — 02:00 Tuesday AEST, inside the night shifts, so
    # the Warden's weekly patrol finds the verdict waiting.
    - cron: "0 16 * * 1"
  workflow_dispatch:

# A hand-dispatched run beside the Monday one would only read the same
# history twice; let the later one wait (zizmor concurrency-limits, #35).
concurrency:
  group: secrets-full-history
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  full-history:
    name: full-history
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
          # Read-only reading of history; nothing here needs the token.
          persist-credentials: false

      - name: Secret scan (gitleaks, every commit on main)
        run: |
          # Version + sha256 are pinned INSIDE the script, once, for both runs.
          GITLEAKS="$(sh scripts/secret-scan.sh fetch)"
          GITLEAKS="$GITLEAKS" sh scripts/secret-scan.sh
