<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* klieg X banner G — the backlot: canvas UI with one persistent character across takes */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; }
  body {
    background: #0A0A0A;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  /* infinite-canvas dot grid */
  .grid {
    position: absolute; inset: 0;
    background-image: radial-gradient(rgba(255,255,255,0.055) 1px, transparent 1px);
    background-size: 26px 26px;
  }
  .grid-fade {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, #0A0A0A 0%, rgba(10,10,10,0.6) 22%, rgba(10,10,10,0) 45%);
  }

  /* edges */
  svg.edges { position: absolute; inset: 0; width: 100%; height: 100%; }
  svg.edges path { stroke: rgba(255,255,255,0.22); stroke-width: 1.25; fill: none; }
  svg.edges circle { fill: #0A0A0A; stroke: rgba(255,255,255,0.35); stroke-width: 1; }

  /* frames */
  .frame {
    position: absolute;
    border: 1px solid #2E2E2E;
    border-radius: 6px;
    background: #111;
    overflow: hidden;
  }
  .frame .img {
    position: absolute; inset: 0;
    background-image: url('photo-2.png');
    background-repeat: no-repeat;
    filter: grayscale(1) contrast(1.05);
  }
  .frame.sel { border-color: rgba(255,255,255,0.75); }
  .cap {
    position: absolute;
    font-family: Consolas, 'Cascadia Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.5);
    white-space: nowrap;
  }

  /* face close-up: region x1420-1520 y540-640 of 2048x1152 → 130x130 frame */
  #f1 { left: 640px; top: 88px; width: 130px; height: 130px; }
  #f1 .img { background-size: 2662px 1498px; background-position: -1846px -702px; }
  #c1 { left: 640px; top: 66px; }

  /* torso: region x1390-1590 y540-840 → 150x225 frame */
  #f2 { left: 880px; top: 180px; width: 150px; height: 225px; }
  #f2 .img { background-size: 1536px 864px; background-position: -1043px -405px; }
  #c2 { left: 880px; top: 158px; }

  /* full body: region x1330-1630 y480-1066 → 156x305 frame */
  #f3 { left: 1150px; top: 96px; width: 156px; height: 305px; }
  #f3 .img { background-size: 1065px 599px; background-position: -692px -250px; }
  #c3 { left: 1150px; top: 74px; }

  /* small text node */
  .chip {
    position: absolute;
    left: 655px; top: 330px;
    border: 1px solid #2E2E2E;
    border-radius: 6px;
    background: #111;
    padding: 10px 14px;
    font-family: Consolas, 'Cascadia Mono', monospace;
    font-size: 10px;
    letter-spacing: 0.18em;
    text-transform: uppercase;
    color: rgba(255,255,255,0.6);
  }

  /* lockup */
  .lockup {
    position: absolute;
    left: 130px;
    top: 50%;
    transform: translateY(-58%);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .wm {
    display: inline-block;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: #EDEDED;
    font-size: 128px;
    line-height: 1;
  }
  .ii { position: relative; display: inline-block; }
  .ii .dot {
    position: absolute;
    left: 50%;
    top: 0.135em;
    width: 0.115em;
    height: 0.115em;
    border-radius: 50%;
    background: #FFFFFF;
    transform: translateX(-50%);
    box-shadow: 0 0 0.18em rgba(255,255,255,0.85), 0 0 0.5em rgba(255,255,255,0.35);
  }
  .tag {
    font-size: 17px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #8A8A8A;
    padding-left: 4px;
  }
</style>
</head>
<body>
  <div class="grid"></div>

  <svg class="edges">
    <path d="M 770 153 C 830 153, 820 292, 880 292" />
    <path d="M 1030 292 C 1090 292, 1090 248, 1150 248" />
    <path d="M 723 330 C 723 310, 705 240, 705 218" />
    <circle cx="770" cy="153" r="3" />
    <circle cx="880" cy="292" r="3" />
    <circle cx="1030" cy="292" r="3" />
    <circle cx="1150" cy="248" r="3" />
  </svg>

  <div class="frame" id="f1"><div class="img"></div></div>
  <span class="cap" id="c1">cast 001</span>

  <div class="frame" id="f2"><div class="img"></div></div>
  <span class="cap" id="c2">take 02</span>

  <div class="frame sel" id="f3"><div class="img"></div></div>
  <span class="cap" id="c3">take 03 &middot; selected</span>

  <div class="chip">wardrobe &middot; 02</div>

  <div class="grid-fade"></div>

  <div class="lockup">
    <span class="wm">kl<span class="ii">ı<span class="dot"></span></span>eg</span>
    <span class="tag">Make it on purpose.</span>
  </div>
</body>
</html>
