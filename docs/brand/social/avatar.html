<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* klieg avatar — monogram lockup from docs/brand/klieg-logo-reference.html */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 400px; height: 400px; }
  body {
    background: #000;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .wm {
    display: inline-block;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: #EDEDED;
    font-size: 172px;
    line-height: 1;
  }
  .ii { position: relative; display: inline-block; }
  .ii .dot {
    position: absolute;
    left: 50%;
    top: 0.135em;
    width: 0.115em;
    height: 0.115em;
    border-radius: 50%;
    background: #FFFFFF;
    transform: translateX(-50%);
    box-shadow: 0 0 0.18em rgba(255,255,255,0.85), 0 0 0.5em rgba(255,255,255,0.35);
  }
</style>
</head>
<body>
  <span class="wm">k<span class="ii">ı<span class="dot"></span></span></span>
</body>
</html>
