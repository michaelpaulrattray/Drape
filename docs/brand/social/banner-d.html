<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* klieg X banner D — photo-2 variant, forced to pure monochrome */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; }
  body {
    background: #0A0A0A;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    position: relative;
    overflow: hidden;
  }
  .photo {
    position: absolute; inset: 0;
    background: url('photo-2.png');
    background-size: cover;
    background-position: center 91%;
    filter: grayscale(1) contrast(1.04);
  }
  .veil {
    position: absolute; inset: 0;
    background: linear-gradient(90deg, rgba(10,10,10,0.85) 0%, rgba(10,10,10,0.35) 30%, rgba(10,10,10,0) 55%);
  }
  .lockup {
    position: absolute;
    left: 130px;
    top: 50%;
    transform: translateY(-58%);
    display: flex;
    flex-direction: column;
    gap: 28px;
  }
  .wm {
    display: inline-block;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: #EDEDED;
    font-size: 128px;
    line-height: 1;
  }
  .ii { position: relative; display: inline-block; }
  .ii .dot {
    position: absolute;
    left: 50%;
    top: 0.135em;
    width: 0.115em;
    height: 0.115em;
    border-radius: 50%;
    background: #FFFFFF;
    transform: translateX(-50%);
    box-shadow: 0 0 0.18em rgba(255,255,255,0.85), 0 0 0.5em rgba(255,255,255,0.35);
  }
  .tag {
    font-size: 17px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #8A8A8A;
    padding-left: 4px;
  }
</style>
</head>
<body>
  <div class="photo"></div>
  <div class="veil"></div>
  <div class="lockup">
    <span class="wm">kl<span class="ii">ı<span class="dot"></span></span>eg</span>
    <span class="tag">Make it on purpose.</span>
  </div>
</body>
</html>
