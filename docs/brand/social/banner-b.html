<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<style>
  /* klieg X banner B — wordmark + "Make it on purpose.", 1500x500 */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1500px; height: 500px; }
  body {
    background: #0A0A0A;
    font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    gap: 36px;
  }
  .wm {
    display: inline-block;
    white-space: nowrap;
    font-weight: 600;
    letter-spacing: -0.015em;
    color: #EDEDED;
    font-size: 150px;
    line-height: 1;
  }
  .ii { position: relative; display: inline-block; }
  .ii .dot {
    position: absolute;
    left: 50%;
    top: 0.135em;
    width: 0.115em;
    height: 0.115em;
    border-radius: 50%;
    background: #FFFFFF;
    transform: translateX(-50%);
    box-shadow: 0 0 0.18em rgba(255,255,255,0.85), 0 0 0.5em rgba(255,255,255,0.35);
  }
  .tag {
    font-size: 19px;
    letter-spacing: 0.34em;
    text-transform: uppercase;
    color: #8A8A8A;
    /* re-center: tracking adds a trailing gap after the final letter */
    padding-left: 0.34em;
  }
</style>
</head>
<body>
  <span class="wm">kl<span class="ii">ı<span class="dot"></span></span>eg</span>
  <span class="tag">Make it on purpose.</span>
</body>
</html>
