# THE CLEANUP MILESTONE'S DELETION DOOR.
#
# One row per symbol on the sweep's reading list. The verdict is the door;
# `argued` names the section of CLEANUP_MILESTONE_TRIAGE.md that argues it, and
# that section — not this line — is the reasoning. A HELD row names its blocker.
#
# Verdicts: KEEP · TAKE (read, and the reading says remove; not yet done) · TAKEN
# · HELD · FILED. A TAKE row deletes nothing by itself — the execution is its own
# commit, with the test question of 8c asked first, and a reviewer sees it there. An EMPTY verdict is the honest record
# of a symbol nobody has read yet, and `check-cleanup-dispositions.mts --strict`
# is green only when there are none left.
#
# TAKEN reads zero and that is correct rather than unused: a symbol removed by a
# previous shift is no longer on the sweep's list, so it has no row. The verdict
# exists for the row that is flipped in the same commit that deletes its symbol —
# git and the triage sections hold the history, and this table holds the door.
#
# A HELD OR TAKE ROW IS A CLAIM ABOUT THE REQUEST PATH, and since 2026-08-22 the
# checker holds it: a symbol under either verdict that has a production importer
# refuses as `rewired`. `stale` catches a row whose symbol went away; that one
# catches a row whose symbol CAME BACK, which no other refusal could see — a
# re-wired symbol simply drops off the sweep's reading list. It was born with a
# live hit in this table (`hairTakeSentence`, triage §25c), so it is not a
# hypothetical. **Do not flip a row to HELD to quiet it; check the callers.**

