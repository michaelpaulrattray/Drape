<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>One mood board, open — same frame as the library</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
body{margin:0;font-family:Inter,system-ui,sans-serif;background:#f4f4f4;color:#0a0a0a}
a{color:#0a0a0a}a:hover{color:#000}
</style>
</helmet>
<div style="width: 1280px; height: 720px; box-sizing: border-box; position: relative; background: #f4f4f4; font-family: Inter, system-ui, sans-serif; color: #0a0a0a; overflow: hidden">

  <div style="position: absolute; inset: 0; padding: 24px 40px; box-sizing: border-box; opacity: 0.35">
    <div style="height: 430px; background: #fff; border: 1px solid #e1e1e1; border-radius: 16px"></div>
  </div>
  <div style="position: absolute; inset: 0; background: rgba(10,10,10,0.42)"></div>

  <div role="dialog" aria-label="Cyber-goth street" style="position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); width: 960px; height: 600px; background: #fff; border-radius: 18px; box-shadow: 0 24px 64px rgba(0,0,0,0.28); padding: 28px 36px; box-sizing: border-box; display: flex; flex-direction: column; gap: 22px">

    <div style="display: flex; align-items: center; justify-content: space-between; gap: 16px; height: 48px">
      <div style="display: flex; align-items: center; gap: 14px; flex-grow: 1">
        <a href="Moodboard.dc.html" aria-label="Back to your boards" style="width: 34px; height: 34px; border-radius: 8px; border: 1px solid #e1e1e1; display: flex; align-items: center; justify-content: center; text-decoration: none; color: #0a0a0a; font-size: 14px">←</a>
        <label style="display: flex; flex-direction: column; gap: 4px; flex-grow: 1">
          <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6b6b">Mood boards</span>
          <input id="board-name" type="text" value="Cyber-goth street" style="font: 600 24px Inter, system-ui, sans-serif; letter-spacing: -0.01em; border: none; padding: 0; outline: none; color: #0a0a0a; background: transparent">
        </label>
      </div>
      <button type="button" aria-label="Close" style="width: 32px; height: 32px; border: none; background: transparent; cursor: pointer; color: #6b6b6b; font-size: 18px">×</button>
    </div>

    <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 10px">
      <div style="display: flex; justify-content: space-between; align-items: baseline">
        <span style="font-family: 'JetBrains Mono', monospace; font-size: 9px; letter-spacing: 0.14em; text-transform: uppercase; color: #6b6b6b">Pictures · 6 of 6</span>
        <span style="font-size: 12px; color: #6b6b6b">Drop several at once. Only what repeats across them is read.</span>
      </div>
      <div style="display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 16px; align-content: start">
        <div style="height: 150px; border-radius: 12px; background: #8d8d8d"></div>
        <div style="height: 150px; border-radius: 12px; background: #a5a5a5"></div>
        <div style="height: 150px; border-radius: 12px; background: #b8b8b8"></div>
        <div style="height: 150px; border-radius: 12px; background: #9c9c9c"></div>
        <div style="height: 150px; border-radius: 12px; background: #c4c4c4"></div>
        <div style="height: 150px; border-radius: 12px; background: #adadad"></div>
        <button type="button" style="height: 150px; border-radius: 12px; border: 1px dashed #bdbdbd; background: transparent; cursor: pointer; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 6px; color: #6b6b6b; font: 500 12px Inter, system-ui, sans-serif">
          <span style="font-size: 20px; line-height: 1" aria-hidden="true">+</span>Add pictures
        </button>
      </div>
    </div>

    <div style="display: flex; justify-content: space-between; align-items: center; border-top: 1px solid #e6e6e6; padding-top: 18px; height: 40px">
      <button type="button" style="height: 36px; padding: 0 4px; border: none; background: transparent; font: 500 12px Inter, system-ui, sans-serif; color: #b3261e; cursor: pointer">Delete board</button>
      <div style="display: flex; gap: 12px; align-items: center">
        <span style="font-size: 12px; color: #6b6b6b; margin-right: 6px">Use it by typing <span style="font-family: 'JetBrains Mono', monospace; color: #0a0a0a">@</span> in a brief, or on a concept picture.</span>
        <button type="button" style="height: 40px; padding: 0 20px; border: none; border-radius: 10px; background: #0a0a0a; color: #fff; font: 600 13px Inter, system-ui, sans-serif; cursor: pointer">Done</button>
      </div>
    </div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":1280,"height":720}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
